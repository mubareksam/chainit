# ChainIt Android release signing key.
#
# This key is committed on purpose: it is a self-generated distribution key for a sideloaded app,
# and Android only performs a true IN-PLACE update (replacing the installed build instead of adding a
# second icon) when the new APK is signed with the SAME certificate as the installed one.
# Losing this file means every future build must be uninstalled and reinstalled manually.
#
# Never regenerate it. Never sign a release with a different key.
