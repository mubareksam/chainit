[workspace]
resolver = "2"
members = [
    "crates/chainit-core",
    "crates/chainit-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ChainIt Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
